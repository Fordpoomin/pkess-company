<!-- NAVBAR UPDATE GUIDE - How to use routing -->

<!-- OPTION 1: Simple routing (recommended for main links) -->
<!-- Replace href="path" with data-route="/path" -->

<!-- BEFORE (old way - full page reload):
<a class="nav-link" href="../pages/category.html">Category</a>
-->

<!-- AFTER (new way - dynamic loading):
<a class="nav-link" data-route="/category">Category</a>
-->

<!-- OPTION 2: Query parameters still work! -->
<!-- The router preserves query strings in URL:
<a class="nav-link" data-route="/category?category=UPS">UPS</a>
-->

<!-- EXAMPLE OF UPDATED NAVBAR WITH ROUTING -->

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container-fluid">
    <!-- Home link uses data-route -->
    <a class="navbar-brand" href="#" data-route="/">
      <div class="align-items-center d-flex">
        <img src="/assets/images/logo.png" alt="logo" height="80">
        <div class="text-truncate px-2 d-none d-sm-block" style="max-width: 34vw;font-size: 14px;">
          PK ENGINEERING SOLUTION SERVICE CO.,LTD.
        </div>
      </div>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <!-- These links now trigger dynamic loading -->
        <li class="nav-item">
          <a class="nav-link" href="#" data-route="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-route="/category">Product</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-route="/detail">Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-route="/contact">Contact Us</a>
        </li>
      </ul>
    </div>

    <!-- Mobile Menu -->
    <div class="offcanvas offcanvas-end text-bg-dark d-md-none" tabindex="-1" id="mobileNav">
      <div class="offcanvas-header">
        <div class="offcanvas-title">Menu</div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="#" data-route="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-route="/category">Product</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-route="/detail">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-route="/contact">Contact Us</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<!-- NOTES:
1. Use data-route attribute instead of href for routing links
2. Router will automatically prevent default and load content dynamically
3. Use href="#" temporarily while navigating
4. Query parameters (?param=value) still work with history API
5. Navigation listeners will highlight active links based on current route
-->
