<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Category</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../assets/css/styles.css" rel="stylesheet" />
</head>

<body>
  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Hero -->
  <div class="hero-banner content">
    <div class="overlay text-center text-white py-5">
      <h1 id="hero-title">Loading...</h1>
      <p id="hero-sub" class="lead mt-5 position-absolute pt-5"></p>
    </div>
  </div>

  <!-- Breadcrumb -->
  <nav class="container mt-3" aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
      <li class="breadcrumb-item"><a id="bc-category" href="#">Category</a></li>
      <li class="breadcrumb-item active" id="bc-subcategory" aria-current="page">Subcategory</li>
    </ol>
  </nav>

  <!-- Grid ของรายการในหมวดย่อย -->
  <div class="container my-4">
    <div id="category-grid" class="row g-4"></div>
  </div>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const category = decodeURIComponent(q.get('category') || '');
    const subcategory = decodeURIComponent(q.get('subcategory') || '');

    $('#navbar-placeholder').load('../assets/components/navbar.html', function () {
      $(`#navbar-placeholder .dropdown-menu a:contains("${category}")`).first()
        .closest('.dropdown').find('> .nav-link').addClass('active text-warning fw-bold');
    });

    $('#footer-placeholder').load('../assets/components/footer.html');

    document.getElementById('hero-title').textContent = subcategory || 'Category';
    document.getElementById('hero-sub').textContent = category || '';
    document.getElementById('bc-category').textContent = category || 'Category';
    document.getElementById('bc-category').href =
      `./detail-category.html?category=${encodeURIComponent(category)}&subcategory=${encodeURIComponent(subcategory)}`;
    document.getElementById('bc-subcategory').textContent = subcategory;

    // ----- DATA (เพิ่ม Battery Monitoring system) -----
    const CATEGORY_DATA = {
      "Battery": {
        "Batt Mon": [
          {
            title: "Cell Watch Eaton",
            img: "../assets/images/products/Cellwatch.jpg",
            link: `./detail.html?category=Battery&subcategory=Batt%20Mon&detail=Cell%20Watch%20Eaton`
          },
          {
            title: "Battery Monitoring system",
            img: "../assets/images/products/PBMS9000Pro.png",
            link: `./detail.html?category=Battery&subcategory=Batt%20Mon&detail=Battery%20Monitoring%20system`
          },
          {
            title: "PKBMS",
            img: "../assets/images/products/PKBMS.png",
            link: `./detail.html?category=Battery&subcategory=Batt%20Mon&detail=PKBMS`
          }
        ]
      }
    };

    const grid = document.getElementById('category-grid');
    const items = (CATEGORY_DATA[category] || {})[subcategory] || [];

    if (items.length === 0) {
      grid.innerHTML = '<p class="text-muted text-center">No items found in this subcategory.</p>';
    } else {
      grid.innerHTML = items.map(it => `
        <div class="col-6 col-md-4 col-lg-3">
          <a href="${it.link}" class="text-decoration-none text-dark d-block h-100">
            <div class="card-product">
              <div class="thumb">
                <img src="${it.img}" alt="${it.title}">
              </div>
              <div class="title">
                <span>${it.title}</span>
              </div>
            </div>
          </a>
        </div>
      `).join('');
    }
  </script>
</body>

</html>
