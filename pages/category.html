<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Category</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../assets/css/styles.css" rel="stylesheet" />
  <link href="../assets/css/loding.css" rel="stylesheet">
</head>

<body>
  <!-- Loader Overlay -->
  <div id="page-loader">
    <div class="loader-card">
      <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Hero -->
  <div class="hero-banner content">
    <div class="overlay text-center text-white py-5">
      <h1 id="hero-title">Loading...</h1>
      <p id="hero-sub" class="lead mt-5 position-absolute pt-5"></p>
    </div>
  </div>

  <!-- Breadcrumb -->
  <nav class="container mt-3" aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
      <li class="breadcrumb-item"><a id="bc-category" href="#">Category</a></li>
      <li class="breadcrumb-item active" id="bc-subcategory" aria-current="page">Subcategory</li>
    </ol>
  </nav>

  <!-- Content -->
  <div class="container my-4 content">
    <!-- รายการตรงของ Category (เช่น BMS) -->
    <div id="direct-items-section" class="mb-4" style="display:none;">
      <h5 class="mb-3">Items</h5>
      <div id="direct-items-grid" class="row g-4"></div>
    </div>

    <!-- หมวดย่อยของ Category -->
    <div id="subcategory-section" class="mb-2" style="display:none;">
      <h5 class="mb-3">Categories</h5>
      <div id="category-grid" class="row g-4"></div>
    </div>

    <!-- รายการภายใน Subcategory -->
    <div id="sub-items-section" class="mb-2" style="display:none;">
      <h5 class="mb-3" id="sub-items-title"></h5>
      <div id="sub-items-grid" class="row g-4"></div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/scripts.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const category   = decodeURIComponent(q.get('category') || '');
    const subcategory = decodeURIComponent(q.get('subcategory') || '');

    // Navbar highlight
    $('#navbar-placeholder').load('../assets/components/navbar.html', function () {
      $(`#navbar-placeholder .dropdown-menu a:contains("${category}")`).first()
        .closest('.dropdown').find('> .nav-link').addClass('active text-warning fw-bold');
    });
    $('#footer-placeholder').load('../assets/components/footer.html');

    // Breadcrumb + Hero
    const bcCat     = document.getElementById('bc-category');
    const bcSub     = document.getElementById('bc-subcategory');
    const heroTitle = document.getElementById('hero-title');
    const heroSub   = document.getElementById('hero-sub');

    if (subcategory) {
      heroTitle.textContent = subcategory;
      heroSub.textContent   = category;
      bcCat.textContent     = category || 'Category';
      bcCat.href            = `./category.html?category=${encodeURIComponent(category)}`;
      bcSub.textContent     = subcategory;
    } else {
      heroTitle.textContent = category || 'Category';
      heroSub.textContent   = '';
      bcCat.textContent     = category || 'Category';
      bcCat.href            = `./category.html?category=${encodeURIComponent(category)}`;
      bcSub.parentElement.style.display = 'none';
    }

    // ---------- DATA ----------
    const FIAMM_MODELS = [
      '12FLB100P','12FLB150P','12FLB200P','12FLB250P',
      '12FLB300P','12FLB350P','12FLB400P','12FLB450P','12FLB540P'
    ];

    const buildFiammItems = () => FIAMM_MODELS.map(code => {
      const title = `FIAMM ${code}`;
      const img   = `../assets/images/products/Battery%20FIAMM/fiamm-${code.toLowerCase()}.jpg`;
      const link  = `./detail.html?category=${encodeURIComponent('Battery VRLA')}`
                  + `&subcategory=${encodeURIComponent('FIAMM')}`
                  + `&detail=${encodeURIComponent(title)}`;
      return { title, img, link };
    });

    const CATEGORY_DATA = {
      // ===== UPS =====
      "UPS": {
        "EATON UPS": [
          {
            title: "EATON UPS",
            img: "../assets/images/products/placeholder.png",
            link: `./detail.html?category=${encodeURIComponent('UPS')}&subcategory=${encodeURIComponent('EATON UPS')}&detail=${encodeURIComponent('EATON UPS')}`
          }
        ],
        "SCHNEIDER (APC)": [
          {
            title: "SCHNEIDER (APC)",
            img: "../assets/images/products/placeholder.png",
            link: `./detail.html?category=${encodeURIComponent('UPS')}&subcategory=${encodeURIComponent('SCHNEIDER (APC)')}&detail=${encodeURIComponent('SCHNEIDER (APC)')}`
          }
        ]
      },

      // ===== Battery VRLA =====
      "Battery VRLA": {
        "FIAMM": buildFiammItems(),
        "VISION": [
          {
            title: "VISION VRLA",
            img: "../assets/images/products/placeholder.png",
            link: `./detail.html?category=${encodeURIComponent('Battery VRLA')}&subcategory=${encodeURIComponent('VISION')}&detail=${encodeURIComponent('VISION VRLA')}`
          }
        ],
        "PKESS": [
          {
            title: "PKESS VRLA",
            img: "../assets/images/products/placeholder.png",
            link: `./detail.html?category=${encodeURIComponent('Battery VRLA')}&subcategory=${encodeURIComponent('PKESS')}&detail=${encodeURIComponent('PKESS VRLA')}`
          }
        ],
        "Sacred Sun": [
          {
            title: "Sacred Sun VRLA",
            img: "../assets/images/products/placeholder.png",
            link: `./detail.html?category=${encodeURIComponent('Battery VRLA')}&subcategory=${encodeURIComponent('Sacred Sun')}&detail=${encodeURIComponent('Sacred Sun VRLA')}`
          }
        ]
      },

      // ===== Battery Lithium =====
      "Battery Lithium": {
        "VISION": [
          {
            title: "VISION Lithium",
            img: "../assets/images/products/placeholder.png",
            link: `./detail.html?category=${encodeURIComponent('Battery Lithium')}&subcategory=${encodeURIComponent('VISION')}&detail=${encodeURIComponent('VISION Lithium')}`
          }
        ]
      },

      // ===== BMS (ไม่มี subcategory) =====
      "BMS": {
        _items: [
          {
            title: "Cell Watch Eaton",
            img: "../assets/images/products/Cellwatch.jpg",
            link: `./detail.html?category=${encodeURIComponent('BMS')}&detail=${encodeURIComponent('Cell Watch Eaton')}`
          },
          {
            title: "PKBMS",
            img: "../assets/images/products/PKBMS.png",
            link: `./detail.html?category=${encodeURIComponent('BMS')}&detail=${encodeURIComponent('PKBMS')}`
          },
          {
            title: "PBMS9000Pro",
            img: "../assets/images/products/PBMS9000Pro.png",
            link: `./detail.html?category=${encodeURIComponent('BMS')}&detail=${encodeURIComponent('PBMS9000Pro')}`
          }
        ]
      }
    };

    // ---------- Render ----------
    const subGrid        = document.getElementById('category-grid');
    const directSection  = document.getElementById('direct-items-section');
    const directGrid     = document.getElementById('direct-items-grid');
    const subSection     = document.getElementById('subcategory-section');
    const subItemsSection= document.getElementById('sub-items-section');
    const subItemsTitle  = document.getElementById('sub-items-title');
    const subItemsGrid   = document.getElementById('sub-items-grid');

    const catData = CATEGORY_DATA[category] || {};

    if (!subcategory) {
      // รายการตรง (เช่น BMS)
      const directItems = catData._items || [];
      if (directItems.length > 0) {
        directSection.style.display = '';
        directGrid.innerHTML = directItems.map(it => `
          <div class="col-6 col-md-4 col-lg-3">
            <a href="${it.link}" class="text-decoration-none text-dark d-block h-100">
              <div class="card-product">
                <div class="thumb"><img src="${it.img}" alt="${it.title}"></div>
                <div class="title"><span>${it.title}</span></div>
              </div>
            </a>
          </div>
        `).join('');
      }

      // หมวดย่อยทั้งหมด
      const subs = Object.keys(catData).filter(k => k !== '_items');
      if (subs.length > 0) {
        subSection.style.display = '';
        subGrid.innerHTML = subs.map(sub => {
          const firstImg = (catData[sub][0] || {}).img || '../assets/images/products/placeholder.png';
          return `
            <div class="col-6 col-md-4 col-lg-3">
              <a href="./category.html?category=${encodeURIComponent(category)}&subcategory=${encodeURIComponent(sub)}"
                 class="text-decoration-none text-dark d-block h-100">
                <div class="card-product">
                  <div class="thumb"><img src="${firstImg}" alt="${sub}"></div>
                  <div class="title"><span>${sub}</span></div>
                </div>
              </a>
            </div>
          `;
        }).join('');
      }

      if (directItems.length === 0 && subs.length === 0) {
        subSection.style.display = '';
        subGrid.innerHTML = '<p class="text-muted text-center">No items found in this category.</p>';
      }
    } else {
      // ภายในหมวดย่อย
      const items = (catData[subcategory] || []);
      subItemsSection.style.display = '';
      subItemsTitle.textContent = subcategory;
      subItemsGrid.innerHTML = items.length
        ? items.map(it => `
            <div class="col-6 col-md-4 col-lg-3">
              <a href="${it.link}" class="text-decoration-none text-dark d-block h-100">
                <div class="card-product">
                  <div class="thumb"><img src="${it.img}" alt="${it.title}"></div>
                  <div class="title"><span>${it.title}</span></div>
                </div>
              </a>
            </div>
          `).join('')
        : '<p class="text-muted text-center">No items found in this subcategory.</p>';
    }
  </script>
</body>
</html>
