<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../assets/css/styles.css" rel="stylesheet" />
  <link href="../assets/css/loding.css" rel="stylesheet">
  <style>
    .breadcrumb-item a {
      text-decoration: none !important;
    }
  </style>
</head>

<body>

  <!-- Loader Overlay -->
  <div id="page-loader">
    <div class="loader-card">
      <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </div>

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Hero -->
  <div class="hero-banner content">
    <div class="overlay text-center text-white py-5">
      <h1 id="hero-title">Loading...</h1>
      <p id="hero-sub" class="lead mt-5 position-absolute pt-5"></p>
    </div>
  </div>

  <!-- Breadcrumb -->
  <nav class="container mt-3" aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
      <li class="breadcrumb-item"><a id="bc-category" href="#">Category</a></li>
      <li class="breadcrumb-item"><a id="bc-subcategory" href="#">Subcategory</a></li>
      <li class="breadcrumb-item active" id="bc-detail" aria-current="page">Detail</li>
    </ol>
  </nav>

  <!-- Content -->
  <div class="content my-4">
    <div class="container-lg">
      <div class="row g-4 align-items-start">
        <div class="col-12 col-lg-5 px-4">
          <img id="detail-image" class="img-fluid rounded shadow-sm" alt="product">
        </div>
        <div class="col-12 col-lg-7">
          <h3 id="detail-title" class="mb-3">Title</h3>
          <div id="detail-content" class="text-secondary">
            รายละเอียด...
          </div>
        </div>
      </div>
    </div>
    <div class="col-12" id="image-row"></div>
  </div>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/scripts.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const category = decodeURIComponent(q.get('category') || '');
    const subcategory = decodeURIComponent(q.get('subcategory') || '');
    const detail = decodeURIComponent(q.get('detail') || '');

    // Navbar
    $('#navbar-placeholder').load('../assets/components/navbar.html', function () {
      $(`#navbar-placeholder .dropdown-menu a:contains("${category}")`).first()
        .closest('.dropdown').find('> .nav-link').addClass('active text-warning fw-bold');
    });
    $('#footer-placeholder').load('../assets/components/footer.html');

    // Breadcrumb + Hero (รองรับกรณีไม่มี subcategory)
    const heroTitle = document.getElementById('hero-title');
    const heroSub = document.getElementById('hero-sub');
    const bcCat = document.getElementById('bc-category');
    const bcSub = document.getElementById('bc-subcategory');
    const bcSubLi = bcSub.parentElement;
    const bcDetail = document.getElementById('bc-detail');

    heroTitle.textContent = detail || 'Detail';
    heroSub.textContent = subcategory ? `${category} • ${subcategory}` : `${category}`;
    bcCat.textContent = category || 'Category';
    bcDetail.textContent = detail || 'Detail';

    if (subcategory) {
      bcCat.href = `./category.html?category=${encodeURIComponent(category)}`;
      bcSub.textContent = subcategory;
      bcSub.href = `./category.html?category=${encodeURIComponent(category)}&subcategory=${encodeURIComponent(subcategory)}`;
      bcSubLi.style.removeProperty('display');
    } else {
      bcCat.href = `./category.html?category=${encodeURIComponent(category)}`;
      bcSubLi.style.display = 'none';
    }

    // ---------- DATA ----------
    const FIAMM_MODELS = [
      '12FLB100P', '12FLB150P', '12FLB200P', '12FLB250P',
      '12FLB300P', '12FLB350P', '12FLB400P', '12FLB450P', '12FLB540P'
    ];

    // helper: คืน object สำหรับแต่ละรุ่น
    const buildFiammDetailMap = () => {
      const obj = {};
      FIAMM_MODELS.forEach(code => {
        const key = `FIAMM ${code}`;
        const img1 = `../assets/images/products/Battery%20FIAMM/fiamm-${code.toLowerCase()}.jpg`;
        obj[key] = {
          imgs: [img1],
          html: `
            <p><strong>${key}</strong> แบตเตอรี่ตระกูล FLB จาก FIAMM สำหรับงานสำรองกำลังไฟ
            (UPS/Telecom/Data Center) โครงสร้าง VRLA AGM พร้อมอายุการใช้งานยาวนาน</p>
            <ul>
              <li>ตระกูล: FLB Series (12V)</li>
              <li>รหัสรุ่น: ${code}</li>
              <li>เหมาะกับ: UPS / Telecom / Data Center</li>
            </ul>
          `
        };
      });
      return obj;
    };

    const DETAIL_DATA = {
      "Battery": {
        "Battery FIAMM": buildFiammDetailMap(),  // <<— รายละเอียดรายรุ่น
        "": {
          "LI-THIUM BATTERY": {
            imgs: ["../assets/images/products/placeholder.png"],
            html: `<p><strong>LI-THIUM BATTERY</strong> ข้อมูลกำลังอัปเดต</p>`
          }
        }
      },
      "Battery BMS": {
        "Batt Mon": {
          "Cell Watch Eaton": {
            imgs: [
              "../assets/images/products/Cellwatch.jpg",
              "../assets/images/products/eaton-cell-watch-01.png",
              "../assets/images/products/eaton-cell-watch-02.png",
              "../assets/images/products/eaton-cell-watch-03.png",
              "../assets/images/products/eaton-cell-watch-04.png",
              "../assets/images/products/eaton-cell-watch-05.png",
              "../assets/images/products/eaton-cell-watch-06.png",
              "../assets/images/products/eaton-cell-watch-07.png",
              "../assets/images/products/eaton-cell-watch-08.png",
              "../assets/images/products/eaton-cell-watch-09.png"
            ],
            html: `
              <p>ระบบมอนิเตอร์แบตเตอรี่ <strong>Cell Watch Eaton</strong> สำหรับ SLA/Lithium ติดตามแรงดัน อุณหภูมิ และ internal resistance แบบ real-time พร้อมการแจ้งเตือน</p>
              <ul>
                <li>รองรับ multi-string</li>
                <li>Web dashboard / Alarm</li>
                <li>รองรับการเชื่อมต่อ Modbus/TCP</li>
              </ul>
            `
          },
          "PBMS9000Pro": {
            imgs: [
              "../assets/images/products/PBMS9000Pro.png",
              "../assets/images/products/PKESS_-PBMS9000PRO-BMS-System-Final5/PKESS_ PBMS9000PRO BMS System (Final)(5)_page-0001.jpg",
              "../assets/images/products/PKESS_-PBMS9000PRO-BMS-System-Final5/PKESS_ PBMS9000PRO BMS System (Final)(5)_page-0002.jpg",
              "../assets/images/products/PKESS_-PBMS9000PRO-BMS-System-Final5/PKESS_ PBMS9000PRO BMS System (Final)(5)_page-0003.jpg",
              "../assets/images/products/PKESS_-PBMS9000PRO-BMS-System-Final5/PKESS_ PBMS9000PRO BMS System (Final)(5)_page-0004.jpg",
              "../assets/images/products/PKESS_-PBMS9000PRO-BMS-System-Final5/PKESS_ PBMS9000PRO BMS System (Final)(5)_page-0005.jpg",
              "../assets/images/products/PKESS_-PBMS9000PRO-BMS-System-Final5/PKESS_ PBMS9000PRO BMS System (Final)(5)_page-0006.jpg"
            ],
            html: `
              <p><strong>Battery Monitoring system</strong> โซลูชันติดตามสถานะแบตเตอรี่แบบเรียลไทม์ ครอบคลุมแรงดัน, กระแส, อุณหภูมิ, IR พร้อมระบบแจ้งเตือนและรายงาน</p>
              <ul>
                <li>รองรับ Multi-String / Multi-Bank</li>
                <li>Dashboard และ Alarm ผ่าน Web</li>
                <li>รองรับ Modbus/TCP, Integration กับ SCADA/EMS</li>
              </ul>
            `
          },
          "PKBMS": {
            imgs: [
              "../assets/images/products/PKBMS.png",
              "../assets/images/products/PK-Battery-Monitoring-system-Data-sheet/PK Battery Monitoring system Data sheet_page-0001.jpg",
              "../assets/images/products/PK-Battery-Monitoring-system-Data-sheet/PK Battery Monitoring system Data sheet_page-0002.jpg"
            ],
            html: `
              <p><strong>PKBMS</strong> โซลูชัน Battery Management System ที่ออกแบบโดย PK Engineering สำหรับงานอุตสาหกรรม</p>
              <ul>
                <li>Cell/Pack monitoring</li>
                <li>Safety cut-off & balancing</li>
                <li>Integration ได้กับ SCADA/EMS</li>
              </ul>
            `
          }
        }
      }
    };

    function getDetailData(cat, sub, name) {
      const byCat = DETAIL_DATA[cat] || {};
      const bySub = (byCat[sub] || byCat[""] || {});
      return bySub[name];
    }

    const data = getDetailData(category, subcategory, detail);
    const imgEl = document.getElementById('detail-image');
    const titleEl = document.getElementById('detail-title');
    const contentEl = document.getElementById('detail-content');
    const imageRow = document.getElementById('image-row');

    if (data) {
      titleEl.textContent = detail;
      imgEl.src = (data.imgs && data.imgs[0]) ? data.imgs[0] : "../assets/images/products/placeholder.png";
      imgEl.alt = detail;
      contentEl.innerHTML = data.html;

      if (data.imgs && data.imgs.length > 1) {
        let html = `<div class="row mt-4 rounded m-0">`;
        data.imgs.slice(1).forEach(src => {
          html += `<div class="col-12 px-0"><img src="${src}" class="img-fluid w-100" alt="${detail}"></div>`;
        });
        html += `</div>`;
        imageRow.innerHTML = html;
      }
    } else {
      titleEl.textContent = detail || 'Detail';
      imgEl.src = "../assets/images/products/placeholder.png";
      imgEl.alt = "no image";
      contentEl.innerHTML = `<p class="text-muted">Coming soon...</p>`;
    }
  </script>
</body>

</html>
