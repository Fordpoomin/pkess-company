<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Detail Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../assets/css/styles.css" rel="stylesheet" />
</head>

<body>

  <!-- Load navbar -->
  <div id="navbar-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get('title') || "";

    // Load navbar then highlight active menu
    $('#navbar-placeholder').load('../assets/components/navbar.html', function () {
      // เมื่อโหลด navbar เสร็จ ค้นหาเมนูที่ตรงกับ title
      $(`#navbar-placeholder a[href*="${encodeURIComponent(title)}"]`).addClass('active text-warning fw-bold');
    });
  </script>

  <!-- Content -->
  <div class="hero-banner content">
    <div class="overlay">
      <h1 id="page-title">Loading...</h1>
    </div>
  </div>

  <div class="container mt-4 ">
    <!-- Hero Banner -->
    <p>รายละเอียดสินค้า/บริการจะปรากฏที่นี่</p>
  </div>

  <!-- แสดงชื่อ title จาก URL -->
  <script>
    const pageTitle = decodeURIComponent(title || '');
    document.getElementById('page-title').textContent = pageTitle || 'ไม่มีหัวข้อ';
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
